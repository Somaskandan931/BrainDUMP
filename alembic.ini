# Alembic CLI config. Run from the ai_os/ root:
#
#   alembic revision --autogenerate -m "add foo to tasks"   # after editing a model
#   alembic upgrade head                                    # apply (the app also does this on boot)
#   alembic downgrade -1
#
# The database URL is NOT set here -- backend/migrations/env.py reads it from
# backend/config.py (DATABASE_URL), so the CLI and the app always agree.

[alembic]
script_location = backend/migrations
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = .

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
