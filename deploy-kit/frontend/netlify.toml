[build]
  command = "npm run build"
  publish = ".next"

# Netlify auto-detects Next.js 14 App Router and applies its Next Runtime
# automatically, but pinning the plugin explicitly avoids surprises if
# that auto-detection ever changes.
[[plugins]]
  package = "@netlify/plugin-nextjs"

# NEXT_PUBLIC_API_URL is NOT set here on purpose — it should be your live
# Render backend URL (e.g. https://brain-dump-backend.onrender.com), set
# as an environment variable in the Netlify UI (Site settings ->
# Environment variables), not committed to the repo.
